name: 每日券码更新

on:
  schedule:
    - cron: '0 23 * * *'   # UTC 23:00 = 北京时间 07:00
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-coupons
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 拉取今日券码并重建页面
        run: python scripts/fetch_and_build.py

      - name: 提交并推送（无变化则跳过）
        run: |
          git config user.name "takeout-coupons-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "今天没有变化，跳过提交"
          else
            git commit -m "券码更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi
